server:
  port: 8081

spring:
  application:
    name: quizplatform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quizplatform}
    username: ${DB_USER:quiz}
    password: ${DB_PASSWORD:quiz}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is created only by Liquibase
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  rabbitmq:
    # In Docker the host is the compose service name (RABBITMQ_HOST=rabbitmq); from the IDE it defaults to localhost.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated           # the broker confirms every publish, a nack is logged
    publisher-returns: true                      # an unroutable event comes back and is logged
    template:
      mandatory: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: quiz-ui
            client-secret: ${KEYCLOAK_CLIENT_SECRET:quiz-ui-dev-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # explicit endpoints (no issuer discovery) so the app can start before Keycloak is ready
            authorization-uri: http://localhost:8080/realms/quizplatform/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/quizplatform/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8080/realms/quizplatform/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/quizplatform/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          # tokens carry the address the browser used (issuer); a container fetches the keys from the compose service name
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/quizplatform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/quizplatform/protocol/openid-connect/certs}

  docker:
    compose:
      file: ../compose.yaml                       # one compose file at the repo root, shared by both services
      enabled: true
      lifecycle-management: start-only            # both services use it: stopping one must not stop the database

management:
  endpoints:
    web:
      exposure:
        include: health
