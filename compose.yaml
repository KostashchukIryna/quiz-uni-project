# Infrastructure (postgres, keycloak, rabbitmq) starts by default and is what `mvn spring-boot:run` uses.
# The three services are in the "apps" profile and run in containers with:
#   docker compose --profile apps up --build
# Inside the compose network every address is a service name (postgres, rabbitmq, keycloak), not localhost.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quizplatform
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/quizplatform-realm.json:/opt/keycloak/data/import/quizplatform-realm.json:ro

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"      # AMQP, used by the services
      - "15672:15672"    # management UI, login guest / guest
    volumes:
      # the broker creates the exchange, the durable queue and the dead-letter queue itself at startup
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  quiz-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: quiz-service/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quizplatform
      RABBITMQ_HOST: rabbitmq
      # tokens are issued for localhost:8080 (the issuer stays the default), the keys are fetched over the network
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/quizplatform/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/quizplatform/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/realms/quizplatform/protocol/openid-connect/userinfo

  scheduler-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      quiz-service: { condition: service_started }     # quiz-service creates the quiz tables this service reads
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quizplatform

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quizplatform
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/quizplatform/protocol/openid-connect/certs
