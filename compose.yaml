services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quizplatform
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/quizplatform-realm.json:/opt/keycloak/data/import/quizplatform-realm.json:ro
